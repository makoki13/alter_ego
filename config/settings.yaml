# ============================================
# alter-ego - Configuración principal
# ============================================

project:
  name: "alter-ego"
  version: "2.0.0"
  language: "es"

# --- Transcripción de audio ---
audio:
  input_dir: "data/audio"
  output_dir: "data/transcriptions"
  supported_formats: [".m4a", ".mp3", ".wav", ".ogg"]
  whisper_model: "whisper-large-v3-turbo"
  language: "es"

# --- Almacenamiento vectorial ---
vector_store:
  provider: "faiss"
  path: "data/vectors"
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  dimension: 384
  batch_size: 64

# --- LLM ---
llm:
  provider: "groq"
  model: "openai/gpt-oss-120b"
  api_key_env: "GROQ_API_KEY"
  max_tokens: 4096
  temperature: 0.7

# --- Agente (Deep Agent harness) ---
agent:
  max_iterations: 10
  verbose: true

# --- Output ---
output:
  biography_path: "output/biografia.md"